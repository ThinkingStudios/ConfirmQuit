modLoader = "javafml"
loaderVersion = "[47,)"
#issueTrackerURL = ""
license = "MIT"

[[mods]]
modId = "rusurequit"
version = "${version}"
displayName = "RuSureQuit"
authors = "TexTrue, ThinkingStudio, CaaMoe, Xiao_Cozi"
description = '''
QuitConfirm unofficial multi-modloader port.
Add a quit confirm screen/toast to avoid mistakenly quitting the game.
'''
logoFile = "assets/rusurequit/icon.png"

[[dependencies.rusurequit]]
modId = "forge"
mandatory = true
versionRange = "[47,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.rusurequit]]
modId = "minecraft"
mandatory = true
versionRange = "[1.20.1,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.rusurequit]]
modId = "cloth_config"
mandatory = true
versionRange = "*"
ordering = "AFTER"
side = "BOTH"
